<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>蝦皮同賣場搜尋</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🦐 蝦皮同賣場搜尋</h1>
  <p class="hint">找出同時販售所有商品的賣場</p>

  <div id="keyword-list">
    <div class="keyword-row">
      <input type="checkbox" checked>
      <input type="text" placeholder="關鍵字，例如：Oral-B 替換刷頭">
      <button class="remove-btn" title="移除">✕</button>
    </div>
    <div class="keyword-row">
      <input type="checkbox" checked>
      <input type="text" placeholder="關鍵字，例如：Oral-B 牙膏">
      <button class="remove-btn" title="移除">✕</button>
    </div>
  </div>
  <button id="addBtn">＋ 新增關鍵字</button>

  <div class="btn-row">
    <button id="searchBtn">搜尋</button>
    <button id="clearBtn" style="display:none">清除</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
